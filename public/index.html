<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Utilizador - OAuth</title>
    <!-- Correção: Adicionar a barra '/' para carregar da raiz do site -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>Painel do Utilizador</h1>
        
        <div id="auth-status">
            <p>Estado: <span id="status-text">A verificar...</span></p>
        </div>

        <div id="login-buttons">
            <a href="/oauth/login/google" class="btn google-btn">Entrar com Google</a>
            <a href="/oauth/login/github" class="btn github-btn">Entrar com GitHub</a>
        </div>

        <div id="user-profile" class="profile-card" style="display: none;">
    <img id="user-avatar" src="" alt="Avatar" width="80" class="avatar">

    <h3 id="user-name"></h3>

    <p id="user-email"></p>

    <form method="post" action="/oauth/logout">
        <button type="submit" class="btn logout-btn">
            Terminar Sessão (Logout)
        </button>
    </form>
</div>
    </div>

    <!-- Correção: Adicionar a barra '/' para carregar da raiz do site -->
    <script src="/app.js"></script>
</body>
</html>
