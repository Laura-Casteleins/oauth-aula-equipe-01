<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Projeto OAuth - Cloudflare Pages</title>
</head>
<body>
    <h1>Painel do Utilizador</h1>
    <div id="auth-status">
        <p>Estado: <span id="status-text">A verificar...</span></p>
    </div>

    <div id="login-buttons">
        <a href="/oauth/login/google"><button>Entrar com Google</button></a>
        <a href="/oauth/login/github"><button>Entrar com GitHub</button></a>
    </div>

    <div id="user-profile" style="display: none;">
        <img id="user-avatar" src="" alt="Avatar" width="80" style="border-radius: 50%;">
        <h3 id="user-name"></h3>
        <p id="user-email"></p>
        <a href="/oauth/logout"><button>Terminar Sessão (Logout)</button></a>
    </div>

    <script>
        // Ao carregar a página, verifica se o utilizador está autenticado via /api/me
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/me');
                const data = await response.json();

                if (data.authenticated) {
                    document.getElementById('status-text').textContent = 'Autenticado';
                    document.getElementById('login-buttons').style.display = 'none';
                    
                    // Exibir dados do perfil
                    document.getElementById('user-profile').style.display = 'block';
                    document.getElementById('user-name').textContent = data.user.name;
                    document.getElementById('user-email').textContent = data.user.email || data.user.username || '';
                    if (data.user.avatar_url || data.user.picture) {
                        document.getElementById('user-avatar').src = data.user.avatar_url || data.user.picture;
                    }
                } else {
                    document.getElementById('status-text').textContent = 'Não autenticado';
                }
            } catch (err) {
                document.getElementById('status-text').textContent = 'Erro ao verificar sessão';
            }
        });
    </script>
</body>
</html>
